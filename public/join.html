<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Light Your Diya</title><link rel="stylesheet" href="/style.css"></head><body><main><h1>✨ A Wall of Light ✨</h1><p>One light. One name. One celebration.</p><section class="panel"><div class="diya"><div class="flame"></div><div class="wick"></div><div class="bowl"></div></div><form id="form"><p>Enter your name and light a diya for everyone to see.</p><input id="name" maxlength="32" autocomplete="name" placeholder="Your name" required><br><button id="submit">Light My Diya 🪔</button></form><div id="celebrate"><h2 id="greeting"></h2><p>Your diya has joined the collective wall!</p><a class="joinlink" href="/wall">See the Wall of Light</a></div><p id="message" role="status"></p></section></main><script>const form=document.querySelector('#form'),button=document.querySelector('#submit'),msg=document.querySelector('#message');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;msg.textContent='Lighting your diya…';try{const r=await fetch('/api/light',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.querySelector('#name').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'Try again');form.style.display='none';document.querySelector('#greeting').textContent=`Happy Diwali, ${data.name}!`;document.querySelector('#celebrate').classList.add('show');msg.textContent='';}catch(err){msg.textContent=err.message;button.disabled=false;}});</script></body></html>
