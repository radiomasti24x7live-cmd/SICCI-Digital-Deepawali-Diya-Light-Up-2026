<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SICCI Digital Deepawali — Wall of Light</title>
<style>
  html,body{min-height:100%;margin:0}
  body{overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#39155e 0%,#1a0a34 52%,#090718 100%);color:#fff4db;font-family:Georgia,serif}
  .top{position:absolute;z-index:5;top:0;left:0;right:0;min-height:125px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 32px;background:linear-gradient(180deg,rgba(16,6,36,.96),rgba(16,6,36,.78));border-bottom:1px solid rgba(255,205,98,.35);box-sizing:border-box;text-align:left}
  .top h1{font-size:clamp(22px,2.5vw,42px);margin:0;color:#ffdb86;text-shadow:0 0 16px #b96b41}
  .top .subtitle{font:14px system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#f4c97e;margin:8px 0 0}
  .counter{text-align:center;font:600 clamp(15px,1.4vw,22px) system-ui,sans-serif;color:#fff2cf}
  .counter strong{display:block;font-size:clamp(30px,3.4vw,56px);color:#ffcd60;line-height:1.1}
  .qrbox{display:flex;align-items:center;gap:12px;font:600 15px system-ui,sans-serif;color:#ffe9b6}
  .qr{display:block;width:90px;height:90px;background:#fff;border:5px solid #fff;border-radius:6px;box-sizing:border-box}
  .wall{position:absolute;inset:125px 0 0;overflow:hidden;background:none;display:block;padding:0;margin:0}
  .wall:before{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff8db 0.7px,transparent 1px),radial-gradient(#ffcb76 0.8px,transparent 1px);background-size:89px 91px,137px 131px;background-position:0 0,29px 47px;opacity:.23}
  .tile{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;width:var(--tile-size,110px);height:var(--tile-height,102px);margin:0;padding:0;border:0;background:none;box-shadow:none;transform:translate(-50%,-50%);animation:floaty var(--dur,6s) ease-in-out infinite alternate;animation-delay:var(--delay,0s);pointer-events:none}
  .tile .diya{position:relative;width:76px;height:70px;flex-shrink:0;filter:drop-shadow(0 0 10px rgba(255,157,36,.8));transform:scale(var(--scale,1));transform-origin:bottom center}
  .tile .flame{position:absolute;left:32px;top:3px;width:15px;height:33px;border-radius:70% 15% 65% 40%;background:linear-gradient(20deg,#ff5b13 5%,#ffb52b 45%,#fff5b0 85%);transform:rotate(43deg);box-shadow:0 0 13px 5px rgba(255,163,42,.55);animation:flicker 1.7s ease-in-out infinite alternate}
  .tile .wick{position:absolute;left:38px;top:32px;width:3px;height:13px;background:#3a170d;transform:rotate(-7deg)}
  .tile .bowl{position:absolute;left:4px;bottom:4px;width:68px;height:29px;border-radius:8px 8px 45px 45px;background:linear-gradient(#f7bc5d,#c25b24 56%,#7c2d1d);border-top:5px solid #ffdd8e;box-sizing:border-box;box-shadow:inset 0 -4px 5px #63201b}
  .tile .name{font:600 var(--name-size,12px) system-ui,sans-serif;color:#fff3c8;text-shadow:0 1px 5px #09021b,0 0 6px #09021b;text-align:center;max-width:100%;overflow-wrap:anywhere;line-height:1.12;max-height:2.3em;overflow:hidden;margin-top:-2px}
  .tile.new{z-index:4;filter:drop-shadow(0 0 12px #ffcf62)}
  @keyframes floaty{from{translate:0 -5px}to{translate:0 7px}}
  @keyframes flicker{from{scale:.92 1;opacity:.88}to{scale:1.07 1.09;opacity:1}}
  @media(max-width:650px){.top{padding:10px;min-height:110px;gap:8px}.top h1{font-size:18px}.top .subtitle{font-size:10px}.counter{font-size:11px}.counter strong{font-size:26px}.qrbox{font-size:10px;gap:5px}.qr{width:62px;height:62px}.wall{inset:110px 0 0}}
  @media(prefers-reduced-motion:reduce){.tile,.tile .flame{animation:none}}
</style>
</head>
<body>
<header class="top">
 <div><h1>🪔 Our Wall of Light 🪔</h1><p class="subtitle">SICCI Digital Deepawali</p></div>
 <div class="counter"><strong id="count">0</strong>Diyas Lit Together</div>
 <div class="qrbox"><span>Scan to<br>light your diya</span><img class="qr" src="/qr" alt="QR code to join"></div>
</header>
<main class="wall" id="wall" aria-label="Live collective diya wall"></main>
<script src="/socket.io/socket.io.js"></script>
<script>
const wall=document.querySelector('#wall');
const count=document.querySelector('#count');
let items=[];
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function random01(seed){return (hash(String(seed))%100000)/100000}
function layout(){
 const n=items.length;if(!n)return;
 const w=wall.clientWidth||1200,h=wall.clientHeight||600;
 const ratio=w/h;
 const cols=Math.max(1,Math.ceil(Math.sqrt(n*ratio*1.1)));
 const rows=Math.ceil(n/cols);
 const cellW=w/cols,cellH=h/rows;
 const size=Math.min(115,cellW*.93,cellH*.94);
 const scale=Math.min(1,size/105);
 const nodes=Array.from(wall.children);
 nodes.forEach((tile,i)=>{
   const item=items[i];const col=i%cols,row=Math.floor(i/cols);
   const jitterX=(random01(item.id+'x')-.5)*Math.min(cellW*.24,24);
   const jitterY=(random01(item.id+'y')-.5)*Math.min(cellH*.22,20);
   const x=(col+.5)*cellW+jitterX,y=(row+.5)*cellH+jitterY;
   tile.style.left=`${Math.max(size/2,Math.min(w-size/2,x))}px`;
   tile.style.top=`${Math.max(size/2,Math.min(h-size/2,y))}px`;
   tile.style.setProperty('--tile-size',`${Math.max(30,size)}px`);
   tile.style.setProperty('--tile-height',`${Math.max(30,size)}px`);
   tile.style.setProperty('--scale',scale.toFixed(3));
   tile.style.setProperty('--name-size',`${Math.max(7,Math.min(13,size*.12))}px`);
   tile.style.setProperty('--dur',`${5+random01(item.id+'d')*3}s`);
   tile.style.setProperty('--delay',`${-random01(item.id+'t')*5}s`);
 });
}
function add(item){
 if(!item||!item.id||items.some(x=>x.id===item.id))return;
 items.push(item);
 const tile=document.createElement('div');tile.className='tile new';
 const diya=document.createElement('div');diya.className='diya';
 for(const cls of ['flame','wick','bowl']){const part=document.createElement('div');part.className=cls;diya.append(part)}
 const label=document.createElement('div');label.className='name';label.textContent=String(item.name||'Guest');
 tile.append(diya,label);wall.append(tile);
 count.textContent=items.length;
 layout();setTimeout(()=>tile.classList.remove('new'),3000);
}
const socket=io();
socket.on('snapshot',all=>{wall.replaceChildren();items=[];if(Array.isArray(all))all.forEach(add)});
socket.on('diya',add);
window.addEventListener('resize',layout);
</script>
</body></html>
