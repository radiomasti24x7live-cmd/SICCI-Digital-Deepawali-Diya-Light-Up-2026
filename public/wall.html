<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SICCI Digital Deepawali — Our Wall of Light</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#230033}
#stage{width:1672px;height:941px;position:absolute;left:0;top:0;transform-origin:top left;background:#360047 url('/deepawali-background.png') center/100% 100% no-repeat;overflow:hidden}
/* Real QR is positioned precisely over the illustrative QR in the artwork. */
#qrframe{position:absolute;left:1208px;top:352px;width:387px;height:370px;z-index:10;background:white;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box;padding:6px}
#qrframe img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:auto}
#lights{position:absolute;left:22px;top:305px;width:1115px;height:445px;z-index:4;pointer-events:none}
.light{position:absolute;width:160px;height:94px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:float 5.8s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px rgba(255,155,42,.4));transition:opacity .5s ease}
.diya{position:relative;width:85px;height:60px;flex:none;filter:drop-shadow(0 0 13px #ff9728)}
.flame{position:absolute;left:37px;top:0;width:16px;height:35px;background:linear-gradient(25deg,#ff5d16 8%,#ffbd30 42%,#fff9c5 84%);border-radius:80% 15% 75% 35%;transform:rotate(42deg);box-shadow:0 0 18px #ffac2c;animation:flicker 1.2s ease-in-out infinite alternate}
.wick{position:absolute;left:42px;top:33px;width:3px;height:11px;background:#5b1e0d}
.bowl{position:absolute;left:6px;bottom:2px;width:75px;height:25px;background:linear-gradient(#ffd276 0%,#c75d22 43%,#8e271a 100%);border-radius:12px 12px 42px 42px;border-top:5px solid #ffe3a1;box-sizing:border-box;box-shadow:inset 0 -5px 6px #652018}
.name{font:700 19px/1.1 system-ui,-apple-system,sans-serif;text-align:center;color:white;text-shadow:0 2px 5px #250025,0 0 8px #250025;max-width:160px;overflow-wrap:anywhere;max-height:2.2em;overflow:hidden}
@keyframes float{from{translate:0 -7px}to{translate:0 9px}}
@keyframes flicker{from{scale:.92 1;opacity:.85}to{scale:1.06 1.12;opacity:1}}
#status{position:absolute;left:35px;bottom:15px;color:#ffe3a6;font:14px system-ui,sans-serif;opacity:.8;z-index:5}
@media(prefers-reduced-motion:reduce){.light,.flame{animation:none}}
</style>
</head>
<body>
<main id="stage" aria-label="SICCI Digital Deepawali interactive wall">
  <section id="lights" aria-live="polite" aria-label="Participants' illuminated diyas"></section>
  <div id="qrframe"><img src="/qr" alt="Scan this QR code to light your diya"></div>
  <div id="status" aria-live="polite"></div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
'use strict';
const stage=document.getElementById('stage');
const lights=document.getElementById('lights');
const status=document.getElementById('status');
const all=[];
const PAGE_SIZE=24;
let page=0,focusUntil=0;
function resize(){const s=Math.min(innerWidth/1672,innerHeight/941);stage.style.transform=`scale(${s})`;stage.style.left=`${(innerWidth-1672*s)/2}px`;stage.style.top=`${(innerHeight-941*s)/2}px`}
addEventListener('resize',resize);resize();
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function draw(){
  lights.replaceChildren();
  if(!all.length){status.textContent='';return}
  const pages=Math.ceil(all.length/PAGE_SIZE);page%=pages;
  const current=all.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);
  // A staggered constellation rather than a straight row. Stable positions per page.
  const cols=6,rows=4,cellW=1115/cols,cellH=445/rows;
  current.forEach((item,i)=>{
    const col=i%cols,row=Math.floor(i/cols),seed=hash(item.id);
    const jitterX=((seed%100)/100-.5)*32;
    const jitterY=(((seed>>>9)%100)/100-.5)*24;
    const tile=document.createElement('div');tile.className='light';
    tile.style.left=`${(col+.5)*cellW+jitterX}px`;
    tile.style.top=`${(row+.5)*cellH+jitterY}px`;
    tile.style.animationDelay=`-${(seed%500)/100}s`;
    const diya=document.createElement('div');diya.className='diya';
    for(const partName of ['flame','wick','bowl']){const part=document.createElement('div');part.className=partName;diya.append(part)}
    const label=document.createElement('div');label.className='name';label.textContent=String(item.name||'Guest');
    tile.append(diya,label);lights.append(tile);
  });
  // No participation count: only an unobtrusive page indicator when necessary.
  status.textContent=pages>1?`Wall of Light · View ${page+1} of ${pages}`:'';
}
function add(item){if(!item||!item.id||all.some(x=>x.id===item.id))return;all.push(item);page=Math.floor((all.length-1)/PAGE_SIZE);focusUntil=Date.now()+9000;draw()}
if(typeof io==='function'){
  const socket=io();
  socket.on('snapshot',data=>{all.length=0;if(Array.isArray(data))for(const item of data)if(item&&item.id&&!all.some(x=>x.id===item.id))all.push(item);page=Math.max(0,Math.ceil(all.length/PAGE_SIZE)-1);draw()});
  socket.on('diya',add);
  socket.on('connect',()=>{status.style.opacity='.8'});
  socket.on('disconnect',()=>{status.textContent='Reconnecting to live wall…'});
}else{status.textContent='Live connection unavailable';}
setInterval(()=>{if(Date.now()<focusUntil||all.length<=PAGE_SIZE)return;page=(page+1)%Math.ceil(all.length/PAGE_SIZE);draw()},12000);
</script>
</body>
</html>
